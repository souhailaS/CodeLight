name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npx --yes @vscode/vsce package --no-dependencies --out codelight.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: codelight-vsix
          path: codelight.vsix
      - run: npx --yes @vscode/vsce publish --no-dependencies --packagePath codelight.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
